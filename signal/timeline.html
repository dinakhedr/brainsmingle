<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal: AI Summit — Project Plan</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Loading Signal Plan…</div>
</div>

<div id="app" style="display:none">

  <header class="site-header">
    <div class="header-left">
      <img src="logo.png" alt="BrainsMingle" class="logo-img">
      <div class="header-divider"></div>
      <div class="header-title">Signal: AI Summit <span>— Project Plan</span></div>
    </div>
    <div class="header-right">
      <span class="pill" id="lastUpdated">—</span>
      <span class="pill live">● Live</span>
      <button class="refresh-btn" id="refreshBtn"><span class="refresh-icon" id="refreshIcon">↻</span> Refresh</button>
    </div>
  </header>

  <!-- Filter Row 1: WS pills -->
  <div class="filter-row" id="filterRow1">
    <span class="filter-label">Workstream</span>
    <div class="ws-pills" id="wsPills"></div>
    <button class="clear-ws-btn" id="clearWsBtn">Show All</button>
  </div>

  <!-- Filter Row 2: dropdowns + single hide toggle -->
  <div class="filter-row" id="filterRow2">
    <span class="filter-label">Owner</span>
    <select class="filter-select" id="ownerFilter"><option value="">All</option></select>

    <span class="filter-label">Status</span>
    <select class="filter-select" id="statusFilter">
      <option value="">All</option>
      <option>Not Started</option><option>In Progress</option>
      <option>In Review</option><option>Done</option>
      <option>Live</option><option>Blocked</option>
    </select>

    <div class="filter-sep"></div>

    <div class="toggle-wrap">
      <div class="toggle" id="hideClosedToggle" role="button" aria-pressed="false" tabindex="0"></div>
      <span class="toggle-lbl">Hide Done / Live / Blocked</span>
    </div>

    <div class="filter-sep"></div>
    <button class="clear-btn" id="clearFilters">Clear all</button>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Gantt -->
  <div class="gantt-wrap">
    <div class="table-scroll" id="tableScroll">
      <table class="gtable" id="ganttTable"></table>
    </div>
    <div class="no-results" id="noResults">No tasks match the current filters.</div>
  </div>

</div>

<script>
// ── Sheet config — exact same pattern as tasklist.html ───
const PUB_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvEz_ZKt_T-x_u2QFAm-Z7RES3WUXNol3MkMxWHyExvza8epHnzAAdNf5SzrxwKq-SWVJ39viHIa3l/pub?output=csv";
const GIDS = {
    tasks:       "1331068384",
    workstreams: "1572308080",
    weeks:       "1421232890",
    owners:      "1511747720"
};

async function fetchCSV(gid) {
    const url = `${PUB_BASE}&gid=${gid}&cachebust=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} for gid=${gid}`);
    const text = await res.text();
    if (text.trim().startsWith("<")) throw new Error(`GID ${gid} returned HTML — check sheet is published to web`);
    return parseCSV(text);
}

function parseCSV(text) {
    const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
    const headers = splitRow(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const vals = splitRow(line);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = (vals[idx]||"").trim(); });
        rows.push(obj);
    }
    return rows;
}

function splitRow(row) {
    const result = []; let cur = "", inQ = false;
    for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c==='"') { if (inQ && row[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
        else if (c===',' && !inQ) { result.push(cur); cur=""; }
        else cur += c;
    }
    result.push(cur);
    return result;
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── Date helpers ─────────────────────────────────────────
const START_DATE = new Date(2026, 5, 1);   // Jun 1
const END_DATE   = new Date(2026, 6, 17);  // Jul 17
const TOTAL_DAYS = Math.round((END_DATE - START_DATE) / 86400000) + 1;
const TODAY      = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

function parseDate(str) {
    if (!str) return null;
    const s = str.trim();
    // dd-Mon-yyyy  e.g. 01-Jun-2026
    const m1 = s.match(/^(\d{1,2})-([A-Za-z]+)-(\d{4})$/);
    if (m1) {
        const mon = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
        return new Date(+m1[3], mon[m1[2].toLowerCase().slice(0,3)], +m1[1]);
    }
    // dd-mm-yyyy
    const m2 = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
    if (m2) return new Date(+m2[3], +m2[2]-1, +m2[1]);
    const d = new Date(s);
    return isNaN(d) ? null : d;
}

function dayIndex(d) { return Math.round((d - START_DATE) / 86400000); }
function isWeekend(d) { const w=d.getDay(); return w===0||w===6; }

function buildDays() {
    const days = [];
    for (let i = 0; i < TOTAL_DAYS; i++) {
        const d = new Date(START_DATE);
        d.setDate(START_DATE.getDate() + i);
        days.push({ index:i, date:d, num:d.getDate(),
            isWeekend: isWeekend(d),
            isToday:   d.getTime()===TODAY.getTime(),
            isMonthDiv: d.getDate()===1 && i>0 });
    }
    return days;
}

function buildWeekBands(days, weeksData) {
    const bands = []; let cur = null;
    days.forEach(day => {
        const wk = weeksData.find(w => {
            const ws = parseDate(w.start_date||w.week_start), we = parseDate(w.end_date||w.week_end);
            return ws && we && day.date >= ws && day.date <= we;
        });
        const key    = wk ? (wk.week_label||wk.week_id||"?") : "?";
        const wStart = wk ? (wk.start_date||wk.week_start||"") : "";
        const wEnd   = wk ? (wk.end_date||wk.week_end||"")   : "";
        const bandKey = key+wStart;
        if (!cur || cur.bandKey!==bandKey) { cur={bandKey,key,wStart,wEnd,span:1}; bands.push(cur); }
        else cur.span++;
    });
    return bands;
}

function fmtBand(str) {
    const d = parseDate(str); if (!d) return "";
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getDate();
}

// ── Owner map (same as tasklist.html) ────────────────────
let ownerMap = {};
function buildOwnerMap(owners) {
    ownerMap = {};
    owners.forEach(row => {
        const norm = {};
        Object.keys(row).forEach(k => { norm[k.trim().toLowerCase()] = (row[k]||"").trim(); });
        const ownerId = norm["owner_id"]||"";
        const name    = norm["display_name"]||norm["name"]||"";
        const hex     = (norm["color_hex"]||norm["color"]||"888888").replace("#","");
        if (!name && !ownerId) return;
        const r=parseInt(hex.slice(0,2),16)||136, g=parseInt(hex.slice(2,4),16)||136, b=parseInt(hex.slice(4,6),16)||136;
        const entry = { color:"#"+hex, bg:`rgba(${r},${g},${b},0.18)`, label:name||ownerId };
        const keys = new Set();
        if (name)    { keys.add(name.trim()); keys.add(name.toLowerCase().trim()); keys.add(name.toLowerCase().replace(/[\s\/\-]+/g,"")); keys.add(name.toLowerCase().split(/\s/)[0]); }
        if (ownerId) { keys.add(ownerId.trim()); keys.add(ownerId.toLowerCase().trim()); }
        keys.forEach(k => { if(k) ownerMap[k] = entry; });
    });
}

function ownerBadgesHTML(str) {
    if (!str) return '<span class="owner-empty">—</span>';
    return str.split(/[,|]/).map(o => {
        const raw = o.trim(); if (!raw) return "";
        const attempts = [raw, raw.toLowerCase(), raw.toLowerCase().replace(/[\s\/\-]+/g,""), raw.toLowerCase().split(/\s+/)[0]];
        let match = null;
        for (const k of attempts) { if (ownerMap[k]) { match=ownerMap[k]; break; } }
        const style = match ? `background:${match.bg};color:${match.color};` : "background:rgba(255,255,255,.08);color:var(--text2);";
        return `<span class="owner-badge" style="${style}">${esc(raw)}</span>`;
    }).join("");
}

// ── Status ───────────────────────────────────────────────
const STATUS_META = {
    "done":        {cls:"s-done",    label:"Done"},
    "in progress": {cls:"s-inprog",  label:"In Progress"},
    "in review":   {cls:"s-review",  label:"In Review"},
    "live":        {cls:"s-live",    label:"Live"},
    "blocked":     {cls:"s-blocked", label:"Blocked"},
    "not started": {cls:"s-notstart",label:"Not Started"},
};
function statusMeta(s) { return STATUS_META[(s||"").toLowerCase().trim()] || {cls:"s-notstart",label:s||"Not Started"}; }
function isClosed(s) { const l=(s||"").toLowerCase(); return l==="done"||l==="live"||l==="blocked"; }

// ── App state ─────────────────────────────────────────────
let activeWS     = new Set(); // empty = show all
let hideClosed   = false;
let allWS = [], allWeeks = [], allTasks = [];
let autoTimer = null;

// ── Stats ─────────────────────────────────────────────────
function updateStats(tasks) {
    const c = {total:0,done:0,inprog:0,review:0,live:0,blocked:0,notstart:0};
    tasks.forEach(t => {
        c.total++;
        const l=(t.status||"").toLowerCase().trim();
        if      (l==="done")        c.done++;
        else if (l==="in progress") c.inprog++;
        else if (l==="in review")   c.review++;
        else if (l==="live")        c.live++;
        else if (l==="blocked")     c.blocked++;
        else                        c.notstart++;
    });
    document.getElementById("statsRow").innerHTML = `
        <div class="stat-card"><div class="stat-val stat-notstart">${c.notstart}</div><div class="stat-lbl">Not Started</div></div>
        <div class="stat-card"><div class="stat-val stat-inprog">${c.inprog}</div><div class="stat-lbl">In Progress</div></div>
        <div class="stat-card"><div class="stat-val stat-review">${c.review}</div><div class="stat-lbl">In Review</div></div>
        <div class="stat-card"><div class="stat-val stat-done">${c.done}</div><div class="stat-lbl">Done</div></div>
        <div class="stat-card"><div class="stat-val stat-live">${c.live}</div><div class="stat-lbl">Live</div></div>
        <div class="stat-card"><div class="stat-val stat-blocked">${c.blocked}</div><div class="stat-lbl">Blocked</div></div>
        <div class="stat-card"><div class="stat-val stat-total">${c.total}</div><div class="stat-lbl">Total</div></div>`;
}

// ── WS Pills ──────────────────────────────────────────────
function buildWsPills() {
    const container = document.getElementById("wsPills");
    container.innerHTML = "";
    allWS.forEach(ws => {
        const pill = document.createElement("div");
        pill.className = "ws-pill";
        pill.dataset.wsid = ws.workstream_id;
        pill.textContent = ws.workstream_name;
        pill.style.color       = ws.color;
        pill.style.borderColor = ws.color+"66";
        pill.style.background  = ws.color+"18";
        pill.addEventListener("click", () => {
            const id = ws.workstream_id;
            if (activeWS.has(id)) { activeWS.delete(id); pill.classList.remove("active"); }
            else                  { activeWS.add(id);    pill.classList.add("active"); }
            applyFilters();
        });
        container.appendChild(pill);
    });
}

// ── Owner filter dropdown ─────────────────────────────────
function buildOwnerFilter() {
    const sel = document.getElementById("ownerFilter");
    // keep existing options if re-building
    while (sel.options.length > 1) sel.remove(1);
    const owners = new Set();
    allTasks.forEach(t => { (t.owner||t.Owner||"").split(/[,|]/).forEach(o => { const n=o.trim(); if(n) owners.add(n); }); });
    Array.from(owners).sort().forEach(name => {
        const opt = document.createElement("option");
        opt.value = name; opt.textContent = name;
        sel.appendChild(opt);
    });
}

// ── Render table ──────────────────────────────────────────
function renderTable() {
    const days  = buildDays();
    const bands = buildWeekBands(days, allWeeks);
    const wsMap = {};
    allWS.forEach(w => { wsMap[w.workstream_id] = w; });

    const table = document.getElementById("ganttTable");
    table.innerHTML = "";

    // colgroup
    const cg = document.createElement("colgroup");
    // frozen cols: WS=140, Task=220, Owner=120, Status=100  → total 580
    [140,220,120,100].forEach(w => {
        const col=document.createElement("col"); col.style.cssText=`width:${w}px;min-width:${w}px`; cg.appendChild(col);
    });
    days.forEach(() => {
        const col=document.createElement("col"); col.style.cssText="width:28px;min-width:28px;max-width:28px"; cg.appendChild(col);
    });
    table.appendChild(cg);

    const thead = document.createElement("thead");

    // Row 1: frozen headers + week bands
    const tr1 = document.createElement("tr");
    const LEFT = [0,140,360,480];
    const LABELS = ["WORKSTREAM","TASK","OWNER","STATUS"];
    LABELS.forEach((lbl,i) => {
        const th=document.createElement("th");
        th.className="th-frz th-band"+(i===3?" th-frz-last":"");
        th.style.left=LEFT[i]+"px";
        th.style.width=(i===1?220:i===0?140:i===2?120:100)+"px";
        th.textContent=lbl;
        tr1.appendChild(th);
    });
    bands.forEach((band,bi) => {
        const th=document.createElement("th");
        th.className="th-week-band"+(bi%2===1?" alt":"");
        th.colSpan=band.span;
        th.textContent=band.key+" · "+fmtBand(band.wStart)+"–"+fmtBand(band.wEnd);
        tr1.appendChild(th);
    });
    thead.appendChild(tr1);

    // Row 2: frozen blanks + day numbers
    const tr2 = document.createElement("tr");
    LABELS.forEach((_,i) => {
        const th=document.createElement("th");
        th.className="th-frz th-dayrow"+(i===3?" th-frz-last":"");
        th.style.left=LEFT[i]+"px";
        tr2.appendChild(th);
    });
    days.forEach(day => {
        const th=document.createElement("th");
        const isSignalDay = day.date.getMonth()===6 && day.date.getDate()>=4 && day.date.getDate()<=10;
        let cls="th-day";
        if(isSignalDay)    cls+=" signal-day";
        if(day.isWeekend)  cls+=" weekend";
        if(day.isToday)    cls+=" today";
        if(day.isMonthDiv) cls+=" month-div";
        th.className=cls; th.textContent=day.num;
        tr2.appendChild(th);
    });
    thead.appendChild(tr2);
    table.appendChild(thead);

    // Body
    const tbody = document.createElement("tbody");
    const wsOrder = allWS.map(w=>w.workstream_id);
    const grouped = {};
    wsOrder.forEach(id => { grouped[id]=[]; });
    allTasks.forEach(t => { if(grouped[t.workstream_id]) grouped[t.workstream_id].push(t); });

    wsOrder.forEach(wsId => {
        const ws = wsMap[wsId]; if(!ws) return;
        (grouped[wsId]||[]).forEach(task => {
            const sm      = statusMeta(task.status);
            const closed  = isClosed(task.status);
            const isDone_ = (task.status||"").toLowerCase().trim()==="done";
            const isLive_ = (task.status||"").toLowerCase().trim()==="live";
            const isBlk_  = (task.status||"").toLowerCase().trim()==="blocked";

            const tr = document.createElement("tr");
            tr.className = "task-row"+(isDone_?" is-done":"")+(isLive_?" is-live":"")+(isBlk_?" is-blocked":"");
            tr.dataset.wsid     = wsId;
            tr.dataset.status   = sm.label;
            tr.dataset.priority = (task.priority||"").trim();
            tr.dataset.owner    = (task.owner||task.Owner||"").trim();

            const frozenBg = isDone_||isLive_ ? "rgba(16,185,129,.06)"
                           : isBlk_           ? "rgba(239,68,68,.05)"
                           : "var(--bg)";
            const dayBg    = isDone_||isLive_ ? "rgba(16,185,129,.03)"
                           : isBlk_           ? "rgba(239,68,68,.02)"
                           : "var(--bg)";
            const dayWkBg  = isDone_||isLive_ ? "rgba(16,185,129,.02)"
                           : isBlk_           ? "rgba(239,68,68,.01)"
                           : "rgba(0,0,0,.20)";
            const barColor = isDone_||isLive_ ? "#10B981"
                           : isBlk_           ? "#EF4444"
                           : (ws.color||"#6B3EF5");

            // WS cell
            const tdWs = document.createElement("td");
            tdWs.className="td-frz td-ws";
            tdWs.style.cssText=`left:0;width:140px;color:${ws.color};background:${frozenBg}`;
            tdWs.textContent=ws.workstream_name;
            tr.appendChild(tdWs);

            // Task cell
            const tdTask=document.createElement("td");
            tdTask.className="td-frz";
            tdTask.style.cssText=`left:140px;width:220px;background:${frozenBg}`;
            tdTask.innerHTML=`<div class="task-text">${esc(task.task||"")}</div>`;
            tr.appendChild(tdTask);

            // Owner cell
            const tdOwner=document.createElement("td");
            tdOwner.className="td-frz";
            tdOwner.style.cssText=`left:360px;width:120px;background:${frozenBg}`;
            tdOwner.innerHTML=ownerBadgesHTML(task.owner);
            tr.appendChild(tdOwner);

            // Status cell
            const tdSt=document.createElement("td");
            tdSt.className="td-frz td-frz-last";
            tdSt.style.cssText=`left:480px;width:100px;background:${frozenBg}`;
            tdSt.innerHTML=`<span class="status-badge ${sm.cls}">${sm.label}</span>`;
            tr.appendChild(tdSt);

            // Day cells
            const startD=parseDate(task.start_date), endD=parseDate(task.end_date);
            const si = startD ? dayIndex(startD) : -1;
            const ei = endD   ? dayIndex(endD)   : -1;

            days.forEach(day => {
                const td=document.createElement("td");
                let cls="td-day";
                if(day.isWeekend)  cls+=" weekend";
                if(day.isMonthDiv) cls+=" month-div";
                if(day.isToday)    cls+=" today";
                td.className=cls;
                td.style.background = day.isToday ? "var(--today-tint)" : day.isWeekend ? dayWkBg : dayBg;

                if(si>=0 && ei>=0 && day.index>=si && day.index<=ei) {
                    const bar=document.createElement("div");
                    let bc="gbar";
                    if(day.index===si && day.index===ei) bc+=" bar-solo";
                    else if(day.index===si)              bc+=" bar-start";
                    else if(day.index===ei)              bc+=" bar-end";
                    bar.className=bc;
                    bar.style.background=barColor;
                    td.appendChild(bar);
                }
                if(day.isToday) {
                    const line=document.createElement("div");
                    line.className="today-line"; td.appendChild(line);
                }
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });
    });
    table.appendChild(tbody);
}

// ── Filters ───────────────────────────────────────────────
function applyFilters() {
    const ownerVal  = document.getElementById("ownerFilter").value;
    const statusVal = document.getElementById("statusFilter").value;
    let vis = 0;
    document.querySelectorAll(".task-row").forEach(row => {
        let show = true;
        // WS filter: if any WS selected, only show those
        if (activeWS.size > 0 && !activeWS.has(row.dataset.wsid)) show=false;
        // Hide closed
        if (show && hideClosed && (row.classList.contains("is-done")||row.classList.contains("is-live")||row.classList.contains("is-blocked"))) show=false;
        // Owner filter (multi-owner support)
        if (show && ownerVal) {
            const owners = (row.dataset.owner||"").split(/[,|]/).map(s=>s.trim());
            if (!owners.includes(ownerVal)) show=false;
        }
        if (show && statusVal && row.dataset.status !== statusVal) show=false;
        row.style.display = show?"":"none";
        if(show) vis++;
    });
    document.getElementById("noResults").style.display = vis===0?"block":"none";
}

// ── Wire events ───────────────────────────────────────────
function wireEvents() {
    document.getElementById("ownerFilter").addEventListener("change",   applyFilters);
    document.getElementById("statusFilter").addEventListener("change",  applyFilters);
    document.getElementById("priorityFilter").addEventListener("change",applyFilters);

    // Hide closed toggle
    const tog = document.getElementById("hideClosedToggle");
    const toggleClosed = () => {
        hideClosed = !hideClosed;
        tog.classList.toggle("on", hideClosed);
        tog.setAttribute("aria-pressed", hideClosed);
        applyFilters();
    };
    tog.addEventListener("click", toggleClosed);
    tog.addEventListener("keydown", e => { if(e.key===" "||e.key==="Enter"){e.preventDefault();toggleClosed();} });

    // Show All WS
    document.getElementById("clearWsBtn").addEventListener("click", () => {
        activeWS.clear();
        document.querySelectorAll(".ws-pill").forEach(p => p.classList.remove("active"));
        applyFilters();
    });

    // Clear all filters
    document.getElementById("clearFilters").addEventListener("click", () => {
        activeWS.clear();
        document.querySelectorAll(".ws-pill").forEach(p => p.classList.remove("active"));
        ["ownerFilter","statusFilter"].forEach(id => { document.getElementById(id).value=""; });
        hideClosed=false;
        tog.classList.remove("on"); tog.setAttribute("aria-pressed","false");
        applyFilters();
    });

    // Refresh button — re-fetches live from sheet
    document.getElementById("refreshBtn").addEventListener("click", () => refreshData());
}

// ── Scroll to day 1 ───────────────────────────────────────
function scrollToToday() {
    // Start at day 1 — no scroll offset
    const scroll = document.getElementById("tableScroll");
    if (scroll) scroll.scrollLeft = 0;
}

// ── Build + render ────────────────────────────────────────
function build(tasks, wsData, weeksData, ownersData) {
    allTasks  = tasks;
    allWS     = wsData;
    allWeeks  = weeksData;
    buildOwnerMap(ownersData);
    buildWsPills();
    buildOwnerFilter();
    renderTable();
    updateStats(tasks);
    document.getElementById("lastUpdated").textContent =
        "Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

// ── Data fetch ────────────────────────────────────────────
async function loadAllSheets() {
    // Fetch all 4 tabs in parallel, cache-busted
    const [tasks, workstreams, weeks, owners] = await Promise.all([
        fetchCSV(GIDS.tasks),
        fetchCSV(GIDS.workstreams),
        fetchCSV(GIDS.weeks),
        fetchCSV(GIDS.owners)
    ]);
    return {tasks, workstreams, weeks, owners};
}

async function refreshData() {
    const btn  = document.getElementById("refreshBtn");
    const icon = document.getElementById("refreshIcon");
    btn.disabled=true;
    icon.classList.add("spinning");
    try {
        const {tasks,workstreams,weeks,owners} = await loadAllSheets();
        build(tasks, workstreams, weeks, owners);
        applyFilters();
    } catch(err) {
        console.error("Refresh failed:", err);
        alert("Refresh failed: "+err.message);
    } finally {
        icon.classList.remove("spinning");
        btn.disabled=false;
    }
}

async function init() {
    try {
        const {tasks,workstreams,weeks,owners} = await loadAllSheets();
        build(tasks, workstreams, weeks, owners);
        wireEvents();
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("app").style.display="block";
        scrollToToday();
        // Auto-refresh every 10 min
        if(autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(refreshData, 600000);
    } catch(err) {
        document.getElementById("loadingText").textContent="";
        document.getElementById("loading").innerHTML += `
            <div class="error-state">
                <h3>⚠ Could not load plan data</h3>
                <p>Make sure the sheet is shared: <strong>Anyone with link → Viewer</strong><br><br>
                Error: ${esc(err.message)}</p>
                <button onclick="location.reload()" class="retry-btn">Retry</button>
            </div>`;
        console.error(err);
    }
}

init();
</script>
</body>
</html>
