// ── Constants ──────────────────────────────────────────
const START_DATE = new Date(2026, 5, 1);   // Jun 1
const END_DATE   = new Date(2026, 6, 17);  // Jul 17
const TOTAL_DAYS = Math.round((END_DATE - START_DATE) / 86400000) + 1; // 47
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

// ── Filter state ───────────────────────────────────────
let activeWS = new Set();
let hideDone = false, hideLive = false, hideBlocked = false;

// ── Helpers ────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseDate(str) {
  if (!str) return null;
  const [dd,mm,yyyy] = str.split('-');
  return new Date(+yyyy, +mm-1, +dd);
}

function dayIndex(d) { return Math.round((d - START_DATE) / 86400000); }
function isWeekend(d) { const w=d.getDay(); return w===0||w===6; }

function buildDays() {
  const days = [];
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = new Date(START_DATE);
    d.setDate(START_DATE.getDate() + i);
    days.push({
      index: i, date: d, num: d.getDate(),
      isWeekend: isWeekend(d),
      isToday: d.getTime() === TODAY.getTime(),
      isMonthDiv: d.getDate() === 1 && i > 0
    });
  }
  return days;
}

function buildWeekBands(days) {
  const bands = [];
  let cur = null;
  days.forEach(day => {
    const wk = EMBEDDED_WEEKS.find(w => {
      const ws = parseDate(w.start_date), we = parseDate(w.end_date);
      return ws && we && day.date >= ws && day.date <= we;
    });
    const key = wk ? wk.week_label : '?';
    const wStart = wk ? wk.start_date : '';
    const wEnd   = wk ? wk.end_date   : '';
    if (!cur || cur.key !== key) {
      cur = { key, wStart, wEnd, span: 1 };
      bands.push(cur);
    } else { cur.span++; }
  });
  return bands;
}

function fmtBand(str) {
  if (!str) return '';
  const d = parseDate(str);
  if (!d) return '';
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
}

function statusMeta(s) {
  const l = (s||'').toLowerCase();
  if (l==='done')        return {cls:'s-done',    label:'Done'};
  if (l==='in progress') return {cls:'s-inprog',  label:'In Progress'};
  if (l==='in review')   return {cls:'s-review',  label:'In Review'};
  if (l==='live')        return {cls:'s-live',    label:'Live'};
  if (l==='blocked')     return {cls:'s-blocked', label:'Blocked'};
  return {cls:'s-notstart', label:'Not Started'};
}

function isDoneStatus(s){ return (s||'').toLowerCase()==='done'; }
function isLiveStatus(s){ return (s||'').toLowerCase()==='live'; }
function isBlockedStatus(s){ return (s||'').toLowerCase()==='blocked'; }

// ── Stats ──────────────────────────────────────────────
function updateStats(tasks) {
  const counts = {total:0, done:0, inprog:0, review:0, live:0, blocked:0, notstart:0};
  tasks.forEach(t => {
    counts.total++;
    const l = (t.status||'').toLowerCase();
    if (l==='done')        counts.done++;
    else if (l==='in progress') counts.inprog++;
    else if (l==='in review')   counts.review++;
    else if (l==='live')        counts.live++;
    else if (l==='blocked')     counts.blocked++;
    else                        counts.notstart++;
  });
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-val" style="color:var(--text)">${counts.total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#34D399">${counts.done}</div><div class="stat-lbl">Done</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--purple-mid)">${counts.inprog}</div><div class="stat-lbl">In Progress</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#FCD34D">${counts.review}</div><div class="stat-lbl">In Review</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#00E8A2">${counts.live}</div><div class="stat-lbl">Live</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#F87171">${counts.blocked}</div><div class="stat-lbl">Blocked</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--text3)">${counts.notstart}</div><div class="stat-lbl">Not Started</div></div>
  `;
}

// ── Build WS pills ─────────────────────────────────────
function buildWsPills() {
  const container = document.getElementById('wsPills');
  container.innerHTML = '';
  EMBEDDED_WS.forEach(ws => {
    const pill = document.createElement('div');
    pill.className = 'ws-pill active';
    pill.dataset.wsid = ws.workstream_id;
    pill.textContent = ws.workstream_name;
    pill.style.color = ws.color;
    pill.style.borderColor = ws.color + '66';
    pill.style.background   = ws.color + '18';
    pill.addEventListener('click', () => {
      if (activeWS.has(ws.workstream_id)) {
        activeWS.delete(ws.workstream_id);
        pill.classList.remove('active');
      } else {
        activeWS.add(ws.workstream_id);
        pill.classList.add('active');
      }
      applyFilters();
    });
    activeWS.add(ws.workstream_id);
    container.appendChild(pill);
  });
}

// ── Build owner filter ─────────────────────────────────
function buildOwnerFilter() {
  const sel = document.getElementById('ownerFilter');
  const owners = new Set();
  EMBEDDED_TASKS.forEach(t => {
    (t.owner||'').split(',').forEach(o => { const n=o.trim(); if(n) owners.add(n); });
  });
  Array.from(owners).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
}

// ── Render table ───────────────────────────────────────
function renderTable() {
  const days  = buildDays();
  const bands = buildWeekBands(days);
  const wsMap = {};
  EMBEDDED_WS.forEach(w => { wsMap[w.workstream_id] = w; });

  const table = document.getElementById('ganttTable');
  table.innerHTML = '';

  // col-widths: WS=140, Task=220, Owner=110, Status=90, then 47×28px day cols
  // Using colgroup for fixed widths
  const colgroup = document.createElement('colgroup');
  [[140],[220],[110],[90]].forEach(([w]) => {
    const col = document.createElement('col');
    col.style.width = w+'px';
    col.style.minWidth = w+'px';
    colgroup.appendChild(col);
  });
  days.forEach(() => {
    const col = document.createElement('col');
    col.style.width = '28px';
    col.style.minWidth = '28px';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);

  const thead = document.createElement('thead');

  // ── Row 1: week bands ──
  const tr1 = document.createElement('tr');
  ['WORKSTREAM','TASK','OWNER','STATUS'].forEach((lbl,i) => {
    const th = document.createElement('th');
    th.className = 'th-freeze th-band-fixed col'+i;
    th.style.left = [0,140,360,470][i]+'px';
    th.textContent = lbl;
    tr1.appendChild(th);
  });
  bands.forEach((band, bi) => {
    const th = document.createElement('th');
    th.className = 'th-week-band' + (bi%2===1?' alt':'');
    th.colSpan = band.span;
    th.textContent = band.key + ' · ' + fmtBand(band.wStart) + '–' + fmtBand(band.wEnd);
    tr1.appendChild(th);
  });
  thead.appendChild(tr1);

  // ── Row 2: day numbers ──
  const tr2 = document.createElement('tr');
  [0,1,2,3].forEach(i => {
    const th = document.createElement('th');
    th.className = 'th-freeze th-day-fixed col'+i;
    th.style.left = [0,140,360,470][i]+'px';
    tr2.appendChild(th);
  });
  days.forEach(day => {
    const th = document.createElement('th');
    let cls = 'th-day';
    if (day.isWeekend) cls += ' weekend';
    if (day.isToday)   cls += ' today';
    if (day.isMonthDiv) cls += ' month-div';
    th.className = cls;
    th.textContent = day.num;
    tr2.appendChild(th);
  });
  thead.appendChild(tr2);
  table.appendChild(thead);

  // ── Body ──
  const tbody = document.createElement('tbody');
  const wsOrder = EMBEDDED_WS.map(w => w.workstream_id);
  const grouped = {};
  wsOrder.forEach(id => { grouped[id] = []; });
  EMBEDDED_TASKS.forEach(t => { if(grouped[t.workstream_id]) grouped[t.workstream_id].push(t); });

  wsOrder.forEach(wsId => {
    const ws = wsMap[wsId];
    if (!ws) return;
    (grouped[wsId]||[]).forEach(task => {
      const sm = statusMeta(task.status);
      const isDone_ = isDoneStatus(task.status);
      const isLive_ = isLiveStatus(task.status);
      const isBlocked_ = isBlockedStatus(task.status);

      const tr = document.createElement('tr');
      tr.className = 'task-row' + (isDone_?' is-done':'') + (isLive_?' is-live':'') + (isBlocked_?' is-blocked':'');
      tr.dataset.wsid     = wsId;
      tr.dataset.status   = sm.label;
      tr.dataset.priority = task.priority||'';
      tr.dataset.owner    = task.owner||'';

      const leftBg = (isDone_||isLive_) ? 'rgba(16,185,129,.07)' : isBlocked_ ? 'rgba(239,68,68,.06)' : 'var(--bg)';

      // WS cell
      const tdWs = document.createElement('td');
      tdWs.className = 'td-freeze col0';
      tdWs.style.cssText = `left:0;color:${ws.color};background:${leftBg};font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:.02em;word-wrap:break-word`;
      tdWs.textContent = ws.workstream_name;
      tr.appendChild(tdWs);

      // Task cell
      const tdTask = document.createElement('td');
      tdTask.className = 'td-freeze col1';
      tdTask.style.cssText = `left:140px;background:${leftBg}`;
      tdTask.innerHTML = `<div class="task-text">${esc(task.task)}</div>`;
      tr.appendChild(tdTask);

      // Owner cell
      const tdOwner = document.createElement('td');
      tdOwner.className = 'td-freeze col2';
      tdOwner.style.cssText = `left:360px;background:${leftBg};font-size:11px;color:var(--text2);font-style:italic;word-wrap:break-word`;
      tdOwner.textContent = task.owner||'—';
      tr.appendChild(tdOwner);

      // Status cell
      const tdStatus = document.createElement('td');
      tdStatus.className = 'td-freeze col3';
      tdStatus.style.cssText = `left:470px;background:${leftBg};`;
      tdStatus.innerHTML = `<span class="status-badge ${sm.cls}">${sm.label}</span>`;
      tr.appendChild(tdStatus);

      // Day cells
      const startD = parseDate(task.start_date);
      const endD   = parseDate(task.end_date);
      const startIdx = startD ? dayIndex(startD) : -1;
      const endIdx   = endD   ? dayIndex(endD)   : -1;
      const barColor = (isDone_||isLive_) ? '#10B981' : isBlocked_ ? '#EF4444' : (ws.color||'#6B3EF5');
      const dayBg    = (isDone_||isLive_) ? 'rgba(16,185,129,.04)' : isBlocked_ ? 'rgba(239,68,68,.03)' : 'var(--bg)';
      const dayWkBg  = (isDone_||isLive_) ? 'rgba(16,185,129,.02)' : isBlocked_ ? 'rgba(239,68,68,.02)' : 'rgba(0,0,0,.18)';

      days.forEach(day => {
        const td = document.createElement('td');
        let cls = 'td-day';
        if (day.isWeekend)  cls += ' weekend';
        if (day.isToday)    cls += ' today';
        if (day.isMonthDiv) cls += ' month-div';
        td.className = cls;
        td.style.background = day.isWeekend ? dayWkBg : dayBg;
        if (day.isToday) td.style.background = 'var(--today-tint)';

        if (startIdx>=0 && endIdx>=0 && day.index>=startIdx && day.index<=endIdx) {
          const bar = document.createElement('div');
          let bc = 'gbar';
          if (day.index===startIdx && day.index===endIdx) bc += ' bar-solo';
          else if (day.index===startIdx) bc += ' bar-start';
          else if (day.index===endIdx)   bc += ' bar-end';
          bar.className = bc;
          bar.style.background = barColor;
          td.appendChild(bar);
        }
        if (day.isToday) {
          const line = document.createElement('div');
          line.className = 'today-line';
          td.appendChild(line);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
}

// ── Filters ────────────────────────────────────────────
function applyFilters() {
  const ownerVal    = document.getElementById('ownerFilter').value;
  const statusVal   = document.getElementById('statusFilter').value;
  const priorityVal = document.getElementById('priorityFilter').value;
  let visible = 0;

  document.querySelectorAll('.task-row').forEach(row => {
    let show = true;
    if (!activeWS.has(row.dataset.wsid))  show = false;
    if (hideDone    && row.classList.contains('is-done'))    show = false;
    if (hideLive    && row.classList.contains('is-live'))    show = false;
    if (hideBlocked && row.classList.contains('is-blocked')) show = false;
    if (show && ownerVal) {
      const owners = (row.dataset.owner||'').split(',').map(s=>s.trim());
      if (!owners.includes(ownerVal)) show = false;
    }
    if (show && statusVal   && row.dataset.status   !== statusVal)   show = false;
    if (show && priorityVal && row.dataset.priority !== priorityVal) show = false;
    row.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('noResults').style.display = visible===0 ? 'block' : 'none';
}

// ── Toggle helper ──────────────────────────────────────
function wireToggle(id, onToggle) {
  const el = document.getElementById(id);
  const activate = () => {
    const next = !el.classList.contains('on');
    el.classList.toggle('on', next);
    el.setAttribute('aria-pressed', next);
    onToggle(next);
    applyFilters();
  };
  el.addEventListener('click', activate);
  el.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){e.preventDefault();activate();} });
}

// ── Wire events ────────────────────────────────────────
function wireEvents() {
  document.getElementById('ownerFilter').addEventListener('change',   applyFilters);
  document.getElementById('statusFilter').addEventListener('change',  applyFilters);
  document.getElementById('priorityFilter').addEventListener('change',applyFilters);

  wireToggle('hideDoneToggle',    v => { hideDone    = v; });
  wireToggle('hideLiveToggle',    v => { hideLive    = v; });
  wireToggle('hideBlockedToggle', v => { hideBlocked = v; });

  document.getElementById('clearFilters').addEventListener('click', () => {
    // Reset WS pills
    activeWS.clear();
    EMBEDDED_WS.forEach(ws => activeWS.add(ws.workstream_id));
    document.querySelectorAll('.ws-pill').forEach(p => p.classList.add('active'));
    // Reset dropdowns
    ['ownerFilter','statusFilter','priorityFilter'].forEach(id => {
      document.getElementById(id).value = '';
    });
    // Reset toggles
    hideDone = hideLive = hideBlocked = false;
    ['hideDoneToggle','hideLiveToggle','hideBlockedToggle'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('on');
      el.setAttribute('aria-pressed','false');
    });
    applyFilters();
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    const btn  = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.disabled = true;
    icon.style.animation = 'spin .6s linear infinite';
    setTimeout(() => {
      renderTable();
      applyFilters();
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      icon.style.animation = '';
      btn.disabled = false;
    }, 500);
  });
}

// ── Scroll to today ────────────────────────────────────
function scrollToToday() {
  const idx = Math.round((TODAY - START_DATE) / 86400000);
  if (idx < 0 || idx >= TOTAL_DAYS) return;
  const frozen = 140 + 220 + 110 + 90; // 560px
  const target = frozen + (idx * 28) - 200;
  const scroll = document.getElementById('tableScroll');
  if (scroll) scroll.scrollLeft = Math.max(0, target);
}

// ── Init ───────────────────────────────────────────────
function init() {
  buildWsPills();
  buildOwnerFilter();
  renderTable();
  updateStats(EMBEDDED_TASKS);
  wireEvents();
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  scrollToToday();
}

init();
</script>
