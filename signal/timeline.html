// Jun 1 – Jul 17 = 47 days
const START_DATE = new Date(2026, 5, 1);  // Jun 1 2026
const END_DATE   = new Date(2026, 6, 17); // Jul 17 2026
const TOTAL_DAYS = Math.round((END_DATE - START_DATE) / 86400000) + 1; // 47

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

let activeWS = new Set();    // empty = all active
let hideDone = false;
let allTasks = [], allWS = [], allWeeks = [];
let autoTimer = null;

// ── Helpers ────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function parseDate(str) {
  if (!str) return null;
  const parts = str.split('-');
  if (parts.length === 3) {
    const [dd, mm, yyyy] = parts;
    return new Date(+yyyy, +mm - 1, +dd);
  }
  return null;
}

function dayIndex(d) {
  // 0-based index from START_DATE
  return Math.round((d - START_DATE) / 86400000);
}

function isWeekend(d) {
  const day = d.getDay();
  return day === 0 || day === 6;
}

async function fetchTasksCSV() { return EMBEDDED_TASKS; }

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i]||'').replace(/^"|"$/g,'').trim(); });
    return obj;
  });
}

// ── Build day columns metadata ──────────────────────────
function buildDays() {
  const days = [];
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = new Date(START_DATE);
    d.setDate(START_DATE.getDate() + i);
    days.push({
      index: i,
      date: d,
      num: d.getDate(),
      month: d.getMonth(), // 5=Jun, 6=Jul
      isWeekend: isWeekend(d),
      isToday: d.getTime() === TODAY.getTime(),
      isMonthDiv: d.getDate() === 1 && i > 0
    });
  }
  return days;
}

// ── Build week bands metadata ───────────────────────────
function buildWeekBands(days, weeksData) {
  const bands = [];
  let cur = null;
  days.forEach(day => {
    const wk = weeksData.find(w => {
      const ws = parseDate(w.start_date);
      const we = parseDate(w.end_date);
      return ws && we && day.date >= ws && day.date <= we;
    });
    const wlabel = wk ? wk.week_label : '?';
    const wStart = wk ? wk.start_date : '';
    const wEnd   = wk ? wk.end_date   : '';
    const wkey   = wlabel + wStart;
    if (!cur || cur.key !== wkey) {
      cur = { key: wkey, wlabel, wStart, wEnd, span: 1, startIdx: day.index };
      bands.push(cur);
    } else {
      cur.span++;
    }
  });
  return bands;
}

// ── Status helpers ──────────────────────────────────────
function statusClass(s) {
  if (!s) return 's-notstart';
  const l = s.toLowerCase();
  if (l.includes('done') || l.includes('complete')) return 's-done';
  if (l.includes('progress') || l.includes('live')) return 's-inprog';
  if (l.includes('review')) return 's-review';
  return 's-notstart';
}
function statusLabel(s) {
  if (!s) return 'Not Started';
  const l = s.toLowerCase();
  if (l.includes('done')) return 'Done';
  if (l.includes('progress')) return 'In Progress';
  if (l.includes('review')) return 'Review';
  return s;
}
function isDone(task) {
  const l = (task.status||'').toLowerCase();
  return l.includes('done') || l.includes('complete');
}

function prioClass(p) {
  if (!p) return '';
  const l = p.toLowerCase();
  if (l === 'high') return 'p-high';
  if (l === 'medium') return 'p-medium';
  if (l === 'low') return 'p-low';
  return '';
}

// ── Main build ──────────────────────────────────────────
function build(tasks, wsData, weeksData) {
  allTasks = tasks;
  allWS = wsData;
  allWeeks = weeksData;

  const days  = buildDays();
  const bands = buildWeekBands(days, weeksData);

  // WS map
  const wsMap = {};
  wsData.forEach(w => { wsMap[w.workstream_id] = w; });

  // Build WS pills
  buildWsPills(wsData);

  // Build owner filter
  buildOwnerFilter(tasks);

  // Render table
  renderTable(tasks, wsMap, days, bands);

  // Stats
  updateStats(tasks);

  // Update timestamp
  document.getElementById('lastUpdated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function buildWsPills(wsData) {
  const container = document.getElementById('wsPills');
  container.innerHTML = '';
  wsData.forEach(ws => {
    const pill = document.createElement('div');
    pill.className = 'ws-pill active';
    pill.dataset.wsid = ws.workstream_id;
    pill.textContent = ws.workstream_name;
    pill.style.color = ws.color || '#9898B8';
    pill.style.borderColor = (ws.color||'#9898B8') + '55';
    pill.style.background = (ws.color||'#9898B8') + '15';
    pill.addEventListener('click', () => {
      const id = ws.workstream_id;
      if (activeWS.has(id)) {
        activeWS.delete(id);
        pill.classList.remove('active');
      } else {
        activeWS.add(id);
        pill.classList.add('active');
      }
      applyFilters();
    });
    container.appendChild(pill);
  });
  // All active by default
  wsData.forEach(ws => activeWS.add(ws.workstream_id));
}

function buildOwnerFilter(tasks) {
  const sel = document.getElementById('ownerFilter');
  const owners = new Set();
  tasks.forEach(t => {
    if (t.owner) {
      t.owner.split(',').forEach(o => {
        const name = o.trim();
        if (name) owners.add(name);
      });
    }
  });
  Array.from(owners).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
}

function renderTable(tasks, wsMap, days, bands) {
  const table = document.getElementById('ganttTable');
  table.innerHTML = '';

  const thead = document.createElement('thead');

  // ── Row 1: Week bands ──
  const tr1 = document.createElement('tr');

  const th1ws = document.createElement('th');
  th1ws.className = 'th-ws-band';
  th1ws.textContent = 'Workstream';
  tr1.appendChild(th1ws);

  const th1task = document.createElement('th');
  th1task.className = 'th-task-band';
  th1task.textContent = 'Task';
  tr1.appendChild(th1task);

  bands.forEach((band, i) => {
    const th = document.createElement('th');
    th.className = 'th-week-band' + (i % 2 === 1 ? ' alt' : '');
    th.colSpan = band.span;
    th.textContent = band.wlabel + ' · ' + fmtBandDate(band.wStart) + '–' + fmtBandDate(band.wEnd);
    tr1.appendChild(th);
  });
  thead.appendChild(tr1);

  // ── Row 2: Day numbers ──
  const tr2 = document.createElement('tr');

  const th2ws = document.createElement('th');
  th2ws.className = 'th-ws-day';
  tr2.appendChild(th2ws);

  const th2task = document.createElement('th');
  th2task.className = 'th-task-day';
  tr2.appendChild(th2task);

  days.forEach(day => {
    const th = document.createElement('th');
    let cls = 'th-day';
    if (day.isWeekend) cls += ' weekend';
    if (day.isToday)   cls += ' today';
    if (day.isMonthDiv) cls += ' month-div';
    th.className = cls;
    th.textContent = day.num;
    tr2.appendChild(th);
  });
  thead.appendChild(tr2);
  table.appendChild(thead);

  // ── Body: group by workstream ──
  const tbody = document.createElement('tbody');

  // Group tasks by workstream
  const wsOrder = allWS.map(w => w.workstream_id);
  const grouped = {};
  wsOrder.forEach(id => { grouped[id] = []; });
  tasks.forEach(t => {
    if (grouped[t.workstream_id]) grouped[t.workstream_id].push(t);
    else grouped['?'] ? grouped['?'].push(t) : (grouped['?'] = [t]);
  });

  wsOrder.forEach(wsId => {
    const ws = wsMap[wsId];
    if (!ws) return;
    const wsTasks = grouped[wsId] || [];
    if (!wsTasks.length) return;

    // Section header row
    const secRow = document.createElement('tr');
    secRow.className = 'ws-section-row';
    secRow.dataset.wsid = wsId;

    const secTd = document.createElement('td');
    secTd.className = 'ws-section-label';
    secTd.colSpan = 2;
    secTd.style.color = ws.color || '#9898B8';
    secTd.textContent = ws.workstream_name;
    secRow.appendChild(secTd);

    // Fill cells for days
    const fillTd = document.createElement('td');
    fillTd.className = 'ws-section-fill';
    fillTd.colSpan = days.length;
    secRow.appendChild(fillTd);
    tbody.appendChild(secRow);

    // Task rows
    wsTasks.forEach(task => {
      const tr = document.createElement('tr');
      tr.className = 'task-row' + (isDone(task) ? ' done' : '');
      tr.dataset.wsid = task.workstream_id;
      tr.dataset.wsname = ws.workstream_name;
      tr.dataset.status = statusLabel(task.status);
      tr.dataset.priority = task.priority || '';
      tr.dataset.owner = task.owner || '';

      // WS name cell
      const tdWs = document.createElement('td');
      tdWs.className = 'td-ws';
      tdWs.style.color = ws.color || '#9898B8';
      tdWs.textContent = ws.workstream_name;
      tr.appendChild(tdWs);

      // Task cell
      const tdTask = document.createElement('td');
      tdTask.className = 'td-task';

      const taskText = document.createElement('div');
      taskText.textContent = task.task || '';
      tdTask.appendChild(taskText);

      const meta = document.createElement('div');
      meta.className = 'task-meta';

      const sc = statusClass(task.status);
      const sl = statusLabel(task.status);
      meta.innerHTML = `<span class="status-badge ${sc}">${esc(sl)}</span>`;

      if (task.priority && task.priority !== 'Low') {
        const pc = prioClass(task.priority);
        meta.innerHTML += `<span class="prio-badge ${pc}">${esc(task.priority)}</span>`;
      }
      if (task.owner) {
        meta.innerHTML += `<span class="task-owner">${esc(task.owner)}</span>`;
      }
      tdTask.appendChild(meta);
      tr.appendChild(tdTask);

      // Day cells
      const startD = parseDate(task.start_date);
      const endD   = parseDate(task.end_date);
      const startIdx = startD ? dayIndex(startD) : -1;
      const endIdx   = endD   ? dayIndex(endD)   : -1;
      const barColor = isDone(task) ? '#10B981' : (ws.color || '#6B3EF5');

      days.forEach(day => {
        const td = document.createElement('td');
        let cls = 'td-day';
        if (day.isWeekend) cls += ' weekend';
        if (day.isToday)   cls += ' today today-line';
        if (day.isMonthDiv) cls += ' month-div';
        td.className = cls;

        // Is this day within the task range?
        if (startIdx >= 0 && endIdx >= 0 && day.index >= startIdx && day.index <= endIdx) {
          const bar = document.createElement('div');
          let barCls = 'gbar';
          if (day.index === startIdx && day.index === endIdx) barCls += ' bar-solo';
          else if (day.index === startIdx) barCls += ' bar-start';
          else if (day.index === endIdx)   barCls += ' bar-end';
          bar.className = barCls;
          bar.style.background = barColor;
          bar.style.opacity = isDone(task) ? '0.75' : '0.88';
          bar.style.left = '0';
          bar.style.right = '0';
          td.appendChild(bar);
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  });

  table.appendChild(tbody);
}

function fmtBandDate(str) {
  if (!str) return '';
  const d = parseDate(str);
  if (!d) return str;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

function updateStats(tasks) {
  const total    = tasks.length;
  const done     = tasks.filter(t => isDone(t)).length;
  const inProg   = tasks.filter(t => (t.status||'').toLowerCase().includes('progress')).length;
  const notStart = tasks.filter(t => {
    const l = (t.status||'').toLowerCase();
    return !l.includes('done') && !l.includes('progress') && !l.includes('complete');
  }).length;
  const highPrio = tasks.filter(t => (t.priority||'').toLowerCase() === 'high').length;

  const row = document.getElementById('statsRow');
  row.innerHTML = `
    <div class="stat-card">
      <div class="stat-val" style="color:var(--text)">${total}</div>
      <div class="stat-lbl">Total Tasks</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#34D399">${done}</div>
      <div class="stat-lbl">Done</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--purple-mid)">${inProg}</div>
      <div class="stat-lbl">In Progress</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--text3)">${notStart}</div>
      <div class="stat-lbl">Not Started</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#F87171">${highPrio}</div>
      <div class="stat-lbl">High Priority</div>
    </div>
  `;
}

// ── Filtering ───────────────────────────────────────────
function applyFilters() {
  const ownerVal    = document.getElementById('ownerFilter').value;
  const statusVal   = document.getElementById('statusFilter').value;
  const priorityVal = document.getElementById('priorityFilter').value;

  const rows = document.querySelectorAll('.task-row');
  let visibleCount = 0;

  rows.forEach(row => {
    let show = true;

    // WS filter
    if (activeWS.size > 0 && !activeWS.has(row.dataset.wsid)) show = false;

    // Hide done
    if (hideDone && row.classList.contains('done')) show = false;

    // Owner filter
    if (show && ownerVal) {
      const owners = (row.dataset.owner||'').split(',').map(s => s.trim());
      if (!owners.includes(ownerVal)) show = false;
    }

    // Status filter
    if (show && statusVal && row.dataset.status !== statusVal) show = false;

    // Priority filter
    if (show && priorityVal && row.dataset.priority !== priorityVal) show = false;

    row.style.display = show ? '' : 'none';
    if (show) visibleCount++;
  });

  // Show/hide section rows based on visible tasks
  const secRows = document.querySelectorAll('.ws-section-row');
  secRows.forEach(secRow => {
    const wsid = secRow.dataset.wsid;
    const anyVisible = Array.from(
      document.querySelectorAll(`.task-row[data-wsid="${wsid}"]`)
    ).some(r => r.style.display !== 'none');
    secRow.style.display = anyVisible ? '' : 'none';
  });

  document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}

// ── Event wiring ────────────────────────────────────────
function wireEvents() {
  document.getElementById('ownerFilter').addEventListener('change', applyFilters);
  document.getElementById('statusFilter').addEventListener('change', applyFilters);
  document.getElementById('priorityFilter').addEventListener('change', applyFilters);

  const toggle = document.getElementById('hideDoneToggle');
  const activateToggle = () => {
    hideDone = !hideDone;
    toggle.classList.toggle('on', hideDone);
    toggle.setAttribute('aria-pressed', hideDone);
    applyFilters();
  };
  toggle.addEventListener('click', activateToggle);
  toggle.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); activateToggle(); } });

  document.getElementById('clearFilters').addEventListener('click', () => {
    // Re-activate all WS pills
    activeWS.clear();
    allWS.forEach(ws => activeWS.add(ws.workstream_id));
    document.querySelectorAll('.ws-pill').forEach(p => p.classList.add('active'));
    document.getElementById('ownerFilter').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('priorityFilter').value = '';
    hideDone = false;
    document.getElementById('hideDoneToggle').classList.remove('on');
    document.getElementById('hideDoneToggle').setAttribute('aria-pressed', false);
    applyFilters();
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    const icon = document.getElementById('refreshIcon');
    const btn  = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    setTimeout(() => {
      build(EMBEDDED_TASKS, EMBEDDED_WS, EMBEDDED_WEEKS);
      applyFilters();
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      btn.classList.remove('spinning');
    }, 400);
  });
}

// ── Init ────────────────────────────────────────────────
function init() {
  build(EMBEDDED_TASKS, EMBEDDED_WS, EMBEDDED_WEEKS);
  wireEvents();
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  scrollToToday();
}

function scrollToToday() {
  const todayIdx = Math.round((TODAY - START_DATE) / 86400000);
  if (todayIdx < 0 || todayIdx >= TOTAL_DAYS) return;
  const colWidth = 28;
  const frozenWidth = 140 + 260; // col-ws + col-task
  const scrollTarget = frozenWidth + (todayIdx * colWidth) - 200;
  const scroll = document.getElementById('tableScroll');
  if (scroll) scroll.scrollLeft = Math.max(0, scrollTarget);
}

init();
</script>
