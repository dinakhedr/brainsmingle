<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Agenda | AI Summit 2026</title>
    <meta name="description" content="Explore the full AI Summit 2026 agenda. 7 days, 5 parallel AI tracks, 100+ speakers, special activations, and Speed Networking Day." />
    <!-- Theme and fonts. Must load before the stylesheet so there is no
         flash of the wrong theme or typeface. Both are set in data/theme.js. -->
    <script src="data/theme.js"></script>

    <link rel="stylesheet" href="style.css" />

    <!-- Favicon follows the browser theme, not the site theme -->
    <link rel="icon" type="image/png" href="assets/brand/favicon-32-purple.png" />
    <link rel="icon" type="image/png" href="assets/brand/favicon-32-purple.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="assets/brand/favicon-32-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
</head>

<body>

    <!-- ══════════════════════════════════════════
     NAV — rendered from data/layout.js
══════════════════════════════════════════ -->
    <div id="site-header"></div>


    <!-- ══════════════════════════════════════════
     HERO
══════════════════════════════════════════ -->
    <section class="ag-hero">
        <div class="ag-hero-glow"></div>
        <div class="ag-hero-inner">
            <div class="ag-hero-eyebrow">Full Agenda · 10 – 16 October 2026</div>
            <h1 class="ag-hero-title">Seven days.<br>Unlimited conversations.</h1>
            <p class="ag-hero-sub">7 days, 5 tracks, 100+ speakers, special activations, and Speed Networking Day.</p>

            <!-- track legend — rendered from data/tracks.js -->
            <div class="track-legend" id="track-legend"></div>
        </div>
    </section>


    <!-- ══════════════════════════════════════════
     DAY TABS — rendered from data/days.js
══════════════════════════════════════════ -->
    <div class="ag-tabs-wrap">
        <div class="ag-tabs" id="ag-tabs"></div>
    </div>


    <!-- ══════════════════════════════════════════
     AGENDA BODY — rendered from days.js + agenda.js + tracks.js + speakers.js
══════════════════════════════════════════ -->
    <div class="ag-body" id="ag-body"></div>


    <!-- ══════════════════════════════════════════
     FOOTER — rendered from data/layout.js
══════════════════════════════════════════ -->
    <div id="site-footer"></div>


    <!-- ══════════════════════════════════════════
     SHARED FILES
     Load order: layout → tracks → days → agenda → speakers → icons → modals
══════════════════════════════════════════ -->
    <script src="data/layout.js"></script>
    <script src="data/tracks.js"></script>
    <script src="data/days.js"></script>
    <script src="data/agenda.js"></script>
    <script src="data/speakers.js"></script>
    <script src="data/icons.js"></script>
    <script>
        var MODAL_IDS = ["registration", "sponsor", "speaker"];
    </script>
    <script src="data/modals.js"></script>

    <script>
        /* ─────────────────────────────────────────
           PAGE CONFIG
           Everything editable lives here. Days, tracks,
           sessions and speakers come from the data files.
           ───────────────────────────────────────── */

        // Maps trackNumber to a key in data/icons.js
        var AG_TRACK_ICON_KEYS = {
            1: "trackLd",
            2: "trackCreative",
            3: "trackStartups",
            4: "trackBusiness",
            5: "trackTech"
        };

        // Opening day panel slots. Day 1 runs earlier than the track days,
        // so it has its own times rather than using SIGNAL_TIME_SLOTS.
        var AG_DAY1_SLOTS = [
            { time: "5:00 PM", sessionId: "ses-d1-p1" },
            { time: "6:00 PM", sessionId: "ses-d1-p2" },
            { time: "7:00 PM", sessionId: "ses-d1-p3" },
            { time: "8:00 PM", sessionId: "ses-d1-p4" },
            { time: "9:00 PM", sessionId: "ses-d1-p5" }
        ];

        // Special activations, keyed by the "special" value in days.js
        var AG_ACTIVATIONS = {
            launchpad: {
                cssClass: "ag-special-launchpad",
                icon    : "launchpad",
                badge   : "Special Activation",
                name    : "AI Summit Launchpad: Startup Showcase",
                meta    : "Open across all tracks · Open to all attendees",
                time    : "9:00 PM"
            },
            talent: {
                cssClass: "ag-special-talent",
                icon    : "talent",
                badge   : "Special Activation",
                name    : "AI Summit Talent: Professional Hiring",
                meta    : "Open across all tracks · Open to all attendees",
                time    : "9:00 PM"
            }
        };

        // The one hour networking wrap that closes every track day
        var AG_DAILY_NETWORKING = {
            cssClass: "ag-special-networking",
            icon    : "networking",
            badge   : "Daily Wrap",
            name    : "Speed Networking: 1 Hour",
            meta    : "Open across all tracks · Open to all attendees",
            time    : "10:00 PM"
        };

        // Placeholder copy shown before sessions are confirmed
        var AG_PLACEHOLDER_SESSION = "Session to be announced";
        var AG_PLACEHOLDER_SPEAKER = "Speaker to be announced";


        document.addEventListener("DOMContentLoaded", function () {
            renderTrackLegend();
            renderDayTabs();
            renderAgendaBody();
        });


        /* ─────────────────────────────────────────
           TAB SWITCHER
           ───────────────────────────────────────── */
        function switchDay(domId, tab) {
            document.querySelectorAll(".ag-day").forEach(d => d.classList.remove("active"));
            document.querySelectorAll(".ag-tab").forEach(t => t.classList.remove("active"));
            const day = document.getElementById(domId);
            if (day) day.classList.add("active");
            if (tab) tab.classList.add("active");
        }


        /* ─────────────────────────────────────────
           TRACK LEGEND
           Colour comes from the .track-N class.
           ───────────────────────────────────────── */
        function renderTrackLegend() {
            const el = document.getElementById("track-legend");
            if (!el) return;

            el.innerHTML = SIGNAL_TRACKS.map(t => `
    <span class="tl-pill track-${t.trackNumber}">
      <span class="tl-icon">${_agIcon(AG_TRACK_ICON_KEYS[t.trackNumber])}</span>
      ${t.shortName}
    </span>
  `).join("");
        }


        /* ─────────────────────────────────────────
           DAY TABS — from data/days.js
           ───────────────────────────────────────── */
        function renderDayTabs() {
            const el = document.getElementById("ag-tabs");
            if (!el) return;

            el.innerHTML = SIGNAL_DAYS.map((day, i) => `
    <div class="ag-tab${i === 0 ? " active" : ""}" onclick="switchDay('${day.domId}', this)">
      ${day.tabLabel}
      <span class="ag-tab-date">${day.tabSublabel}</span>
    </div>
  `).join("");
        }


        /* ─────────────────────────────────────────
           AGENDA BODY
           Builds every day from days.js rather than a
           hardcoded list, so adding a day is a data edit.
           ───────────────────────────────────────── */
        function renderAgendaBody() {
            const el = document.getElementById("ag-body");
            if (!el) return;

            el.innerHTML = SIGNAL_DAYS.map((day, i) => {
                if (day.type === "opening")    return renderOpeningDay(day, i === 0);
                if (day.type === "networking") return renderNetworkingDay(day, i === 0);
                return renderTrackDay(day, i === 0);
            }).join("");

            if (typeof applyPageGates === "function") applyPageGates(el);
            if (typeof applyRegistrationCopy === "function") applyRegistrationCopy();
        }


        /* ─────────────────────────────────────────
           DAY 1 — Opening panels
           ───────────────────────────────────────── */
        function renderOpeningDay(day, isActive) {
            const panels = AG_DAY1_SLOTS.map((s, i) => {
                const session = SIGNAL_AGENDA.find(a => a.id === s.sessionId);
                const title   = (session && session.title) ? session.title : AG_PLACEHOLDER_SESSION;
                const names   = _speakerNames(session);

                return `
      <div class="ag-panel-row">
        <div class="ag-time-label">${s.time}</div>
        <div class="ag-panel">
          <div class="ag-panel-num">0${i + 1}</div>
          <div class="ag-panel-content">
            <div class="ag-panel-title${session && session.title ? "" : " ag-session-title--placeholder"}">${title}</div>
            <div class="ag-panel-meta">${names || AG_PLACEHOLDER_SPEAKER}</div>
          </div>
        </div>
      </div>`;
            }).join("");

            return `
    <div class="ag-day${isActive ? " active" : ""}" id="${day.domId}">
      ${_dayHeader(day, day.label + " · " + day.displayLabel)}
      ${panels}
      ${_specialRow(AG_DAILY_NETWORKING)}
    </div>`;
        }


        /* ─────────────────────────────────────────
           DAYS 2 to 6 — Track grid
           ───────────────────────────────────────── */
        function renderTrackDay(day, isActive) {
            // Activation days give up their last slot to the activation
            const slots = day.special
                ? SIGNAL_TIME_SLOTS.slice(0, SIGNAL_TIME_SLOTS.length - 1)
                : SIGNAL_TIME_SLOTS;

            const timeRows = slots.map(s => `
      <div class="ag-time-row">
        <div class="ag-time-label">${s.display}</div>
        ${SIGNAL_TRACKS.map(t => _sessionCell(day.day, s.slot, t.trackNumber)).join("")}
      </div>`).join("");

            const activation = day.special ? _specialRow(AG_ACTIVATIONS[day.special]) : "";

            return `
    <div class="ag-day${isActive ? " active" : ""}" id="${day.domId}">
      ${_dayHeader(day, _trackDayTag(day))}
      ${_trackHeader()}
      ${timeRows}
      ${activation}
      ${_specialRow(AG_DAILY_NETWORKING)}
    </div>`;
        }


        /* ─────────────────────────────────────────
           DAY 7 — Speed Networking
           ───────────────────────────────────────── */
        function renderNetworkingDay(day, isActive) {
            return `
    <div class="ag-day${isActive ? " active" : ""}" id="${day.domId}">
      ${_dayHeader(day, day.label + " · Closing Day")}
      <div class="ag-sn-hero">
        <div class="ag-sn-label">
          <span class="ag-badge-icon">${_agIcon("speedNetworking")}</span>
          Full Day Activation · All Tracks · Open to All
        </div>
        <div class="ag-sn-title">${day.displayLabel}</div>
        <p class="ag-sn-sub">Structured networking rounds powered by the BrainsMingle speed networking engine, connecting founders, developers, researchers, recruiters, and professionals across the entire AI ecosystem.</p>
      </div>
      <div class="ag-day-cta">
        <a href="#" class="btn btn-yellow" data-cta="registration">Join the Waiting List</a>
        <a href="sponsors.html" data-page="sponsors" class="btn btn-outline">Become a Sponsor</a>
      </div>
    </div>`;
        }


        /* ─────────────────────────────────────────
           SHARED PIECES
           ───────────────────────────────────────── */

        function _dayHeader(day, tag) {
            return `
      <div class="ag-day-header">
        <div class="ag-day-tag">${tag}</div>
        <h2 class="ag-day-title">${day.date}</h2>
        <p class="ag-day-desc">${day.description}</p>
      </div>`;
        }

        function _trackDayTag(day) {
            const activation = day.special ? AG_ACTIVATIONS[day.special] : null;
            return activation
                ? `${day.label} · Track Sessions + ${activation.name.split(":")[0]}`
                : `${day.label} · Track Sessions`;
        }

        function _trackHeader() {
            const cols = SIGNAL_TRACKS.map(t => `
      <div class="ag-track-col-label track-${t.trackNumber}">${t.shortName}</div>`).join("");
            return `<div class="ag-track-header"><div class="ag-track-col-label time-col"></div>${cols}</div>`;
        }

        function _sessionCell(dayNumber, slot, trackNumber) {
            const session = getSessionByCell(dayNumber, trackNumber, slot);
            const hasTitle = session && session.title;
            const chips = _speakerChips(session);

            return `
      <div class="ag-session track-${trackNumber}">
        <div class="ag-session-title${hasTitle ? "" : " ag-session-title--placeholder"}">${hasTitle ? session.title : AG_PLACEHOLDER_SESSION}</div>
        ${chips || `<div class="ag-session-speaker ag-session-speaker--placeholder">${AG_PLACEHOLDER_SPEAKER}</div>`}
      </div>`;
        }

        // One row spanning all five tracks: activations and the networking wrap
        function _specialRow(config) {
            if (!config) return "";
            return `
      <div class="ag-special-merged">
        <div class="ag-time-label">${config.time}</div>
        <div class="ag-special-card ${config.cssClass}">
          <div>
            <div class="ag-special-badge">
              <span class="ag-badge-icon">${_agIcon(config.icon)}</span>
              ${config.badge}
            </div>
            <div class="ag-special-name">${config.name}</div>
            <div class="ag-special-meta">${config.meta}</div>
          </div>
        </div>
      </div>`;
        }


        /* ─────────────────────────────────────────
           HELPERS
           ───────────────────────────────────────── */

        // SVG is pulled straight from data/icons.js so it is already in the
        // markup and never arrives after the icon injector has run.
        function _agIcon(key) {
            return (typeof SIGNAL_ICONS !== "undefined" && SIGNAL_ICONS[key]) ? SIGNAL_ICONS[key] : "";
        }

        function _speakerChips(session) {
            if (!session || !session.speakerIds || !session.speakerIds.length) return "";
            const chips = session.speakerIds.map(id => {
                const spk = SIGNAL_SPEAKERS_MAP[id];
                if (!spk) return "";
                const photo = spk.imagePath
                    ? `<img class="speaker-chip__photo" src="${spk.imagePath}" alt="${spk.name}" loading="lazy" />`
                    : `<span class="speaker-chip__initials">${_initials(spk.name)}</span>`;
                return `<span class="speaker-chip">${photo}<span class="speaker-chip__name">${spk.name}</span></span>`;
            }).join("");
            return chips ? `<div class="ag-session-speakers">${chips}</div>` : "";
        }

        function _speakerNames(session) {
            if (!session || !session.speakerIds) return "";
            return session.speakerIds
                .map(id => SIGNAL_SPEAKERS_MAP[id] ? SIGNAL_SPEAKERS_MAP[id].name : null)
                .filter(Boolean)
                .join(" · ");
        }

        function _initials(name) {
            return name.split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
        }
    </script>

</body>

</html>
