<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ============================
       SEO
       ============================ -->
  <title>Blog — BrainsMingle</title>
  <meta name="description" content="Playbooks and perspectives on building professional communities, running live learning, monetizing expertise, and launching white-label platforms, from the BrainsMingle team.">
  <link rel="canonical" href="https://brainsmingle.com/blog/index.html">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0B0B12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BrainsMingle">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_EG">
  <meta property="og:url" content="https://brainsmingle.com/blog/index.html">
  <meta property="og:title" content="Blog — Ideas on community, learning, and getting paid.">
  <meta property="og:description" content="Playbooks and perspectives on building professional communities, running live learning, monetizing expertise, and launching white-label platforms, from the BrainsMingle team.">
  <meta property="og:image" content="https://brainsmingle.com/assets/og/og-blog.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BrainsMingle Blog — ideas on community, learning, and getting paid.">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@brainsmingle">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Blog",
    "headline": "Ideas on community, learning, and getting paid.",
    "url": "https://brainsmingle.com/blog/index.html",
    "description": "Playbooks and perspectives on building professional communities, running live learning, monetizing expertise, and launching white-label platforms, from the BrainsMingle team.",
    "isPartOf": { "@type": "WebSite", "name": "BrainsMingle", "url": "https://brainsmingle.com/" },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://brainsmingle.com/" },
          { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://brainsmingle.com/blog/index.html" }
        ]
      }
  }
  </script>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32-purple.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32-white.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />

  <!-- Styles, then theme (order matters) -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/style-shared.css" />

  <script src="../assets/js/theme.js"></script>

</head>
<body>

  <div id="site-header"></div>

  <!-- ============================
       HERO (placeholder) — tone published by nav.js from config (purple)
       ============================ -->
  <section class="section" data-page="blog/index.html" style="position:relative;overflow:hidden;text-align:center;">
    <div class="glow" style="top:-160px;left:50%;transform:translateX(-50%);"></div>
    <div class="container container--narrow" style="position:relative;z-index:1;">
      <span class="eyebrow">Blog</span>
      <h1 class="heading-xl">Ideas on community, learning, and getting paid.</h1>
      <p style="color:var(--text-secondary);font-size:var(--text-lg);line-height:var(--leading-normal);margin-top:var(--space-md);">Playbooks and perspectives on building professional communities, running live learning, monetizing expertise, and launching white-label platforms — from the BrainsMingle team.</p>
    </div>
  </section>

  <!-- ============================
       PLACEHOLDER BODY — replace with real content
       ============================ -->
  <section class="section">
    <div class="container container--narrow" style="text-align:center;">
      <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:var(--text-sm);border:1px dashed var(--border);border-radius:var(--radius-md);padding:var(--space-xl);">
        Blog homepage &middot; placeholder content &middot; blog/index.html
      </p>
    </div>
  </section>

  <!-- Footer + mobile bar — built by nav.js -->
  <div id="site-footer"></div>
  <div id="site-mobile-cta"></div>

  <!-- Body scripts -->
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/illustrations.js"></script>
  <script src="../assets/js/modals.js"></script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
