<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>BrainsMingle Help Center | Guides, Tutorials & Support</title>
    <meta name="description" content="Get help with BrainsMingle. Browse step-by-step guides on live sessions, communities, speed networking, courses, payments, and more.">
    <link rel="canonical" href="https://brainsmingle.com/help/">

    <!-- Open Graph -->
    <meta property="og:title" content="BrainsMingle Help Center | Guides, Tutorials & Support">
    <meta property="og:description" content="Step-by-step guides on live sessions, communities, speed networking, courses, payments, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://brainsmingle.com/help/">
    <meta property="og:image" content="https://brainsmingle.com/help/og-image.png">

    <!-- Fonts & icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="icon-purple.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Nav -->
    <div id="kb-nav"></div>

    <!-- Hero -->
    <header class="hero">
        <h1>BrainsMingle Help</h1>
        <p>Everything you need to get started and beyond</p>
        <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" class="search-input" placeholder="Search articles..." id="search-input" autocomplete="off">
            <div class="search-results" id="search-results"></div>
        </div>
        <div class="popular-tags" id="popular-tags">
            <span class="popular-label">Popular:</span>
            <button class="popular-tag" data-query="session">Sessions</button>
            <button class="popular-tag" data-query="community">Community</button>
            <button class="popular-tag" data-query="networking">Networking</button>
            <button class="popular-tag" data-query="payment">Payments</button>
            <button class="popular-tag" data-query="course">Courses</button>
        </div>
    </header>

    <!-- Sections Grid (home view) -->
    <main class="sections" id="sections-home">
        
        <!-- section grid -->
        <div class="sections-grid" id="sections-grid"></div>
        
        <!-- search results -->
        <div class="home-results" id="home-results" style="display:none;">
            <div class="home-results-header">
                <span id="home-results-count"></span>
                <button class="home-results-clear" id="home-results-clear">Clear search</button>
            </div>
            <ul class="home-results-list" id="home-results-list"></ul>
        </div>
    </main>

    <!-- Section Detail (drill-down view) -->
    <div class="section-detail" id="section-detail">
        <a class="back-link" id="back-link">
            <i class="ti ti-arrow-left"></i> All topics
        </a>
        <div class="detail-header">
            <div class="card-icon"><i id="detail-icon"></i></div>
            <div>
                <div class="detail-title" id="detail-title"></div>
                <div class="detail-count" id="detail-count"></div>
            </div>
        </div>
        <ul class="article-list" id="article-list"></ul>
    </div>

    <!-- Footer -->
    <div id="kb-footer"></div>

    <script src="kb-data.js"></script>
    <script src="kb-keywords.js"></script>

    <script>
        const grid = document.getElementById('sections-grid');
        const homeView = document.getElementById('sections-home');
        const detailView = document.getElementById('section-detail');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        // Section descriptions for homepage cards
        const SECTION_DESCRIPTIONS = {
            'getting-started': 'Set up your profile, manage your settings, and send direct messages.',
            'communities': 'Create and configure communities, manage members, channels, and navigation tabs.',
            'live-sessions': 'Schedule sessions and webinars, run breakout rooms and polls, and use the call toolbar.',
            'speed-networking': 'Create and manage speed networking rooms and review post-event connection summaries.',
            'consultation': 'Offer consultation services, manage requests and bookings, and track your earnings.',
            'courses-lms': 'Build programs with courses and lessons, set up certification, and view analytics.',
            'forms': 'Create registration forms and view or export the responses you collect.',
            'payments': 'Connect Stripe, set up paid memberships and sessions, track earnings, and manage coupons.'
        };

        function countArticles(section) {
            return section.groups.reduce((sum, g) => sum + g.articles.length, 0);
        }

        function renderGrid() {
            grid.innerHTML = '';
            KB_SECTIONS.forEach((section, idx) => {
                const count = countArticles(section);
                const desc = SECTION_DESCRIPTIONS[section.id] || '';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
          <div class="card-icon"><i class="ti ${section.icon}"></i></div>
          <div class="card-title">${section.title}</div>
          <div class="card-desc">${desc}</div>
        `;
                card.addEventListener('click', () => showDetail(idx));
                grid.appendChild(card);
            });
        }

        function showDetail(idx) {
            const section = KB_SECTIONS[idx];
            const count = countArticles(section);
            document.getElementById('detail-icon').className = `ti ${section.icon}`;
            document.getElementById('detail-title').textContent = section.title;
            document.getElementById('detail-count').textContent = `${count} article${count !== 1 ? 's' : ''}`;

            const list = document.getElementById('article-list');
            list.innerHTML = '';

            section.groups.forEach(group => {
                if (group.label) {
                    const labelLi = document.createElement('li');
                    labelLi.className = 'group-label';
                    labelLi.textContent = group.label;
                    list.appendChild(labelLi);
                }

                group.articles.forEach(article => {
                    const li = document.createElement('li');
                    li.className = 'article-item';
                    li.innerHTML = `
            <a href="${article.url}">
              <i class="ti ti-file-text"></i>
              <span>${article.title}</span>
              <i class="ti ti-chevron-right"></i>
            </a>
          `;
                    list.appendChild(li);
                });
            });

            homeView.style.display = 'none';
            detailView.classList.add('active');
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function showHome() {
            detailView.classList.remove('active');
            homeView.style.display = 'block';
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        document.getElementById('back-link').addEventListener('click', showHome);

        document.addEventListener('click', (e) => {
            const navHome = e.target.closest('#nav-home');
            if (navHome) {
                e.preventDefault();
                showHome();
            }
        });

        // Live search
        function buildSearchIndex() {
            const index = [];
            KB_SECTIONS.forEach(section => {
                section.groups.forEach(group => {
                    group.articles.forEach(article => {
                        const keywords = (typeof KB_KEYWORDS !== 'undefined' && KB_KEYWORDS[article.url]) || [];
                        index.push({
                            title: article.title,
                            url: article.url,
                            section: section.title,
                            icon: section.icon,
                            sectionId: section.id,
                            keywords: keywords.join(' ').toLowerCase()
                        });
                    });
                });
            });
            return index;
        }

        const searchIndex = buildSearchIndex();

        const homeResults = document.getElementById('home-results');
        const homeResultsList = document.getElementById('home-results-list');
        const homeResultsCount = document.getElementById('home-results-count');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            searchResults.classList.remove('active');

            if (query.length < 2) {
                homeResults.style.display = 'none';
                grid.style.display = '';
                return;
            }

            const matches = searchIndex.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.section.toLowerCase().includes(query) ||
                item.keywords.includes(query)
            );
            
            homeView.style.display = 'block';
            detailView.classList.remove('active');

            grid.style.display = 'none';
            homeResults.style.display = 'block';

            homeResultsCount.textContent = matches.length
                ? `${matches.length} result${matches.length !== 1 ? 's' : ''} for "${searchInput.value.trim()}"`
                : `No results for "${searchInput.value.trim()}"`;

            homeResultsList.innerHTML = matches.map(m => `
                <li class="article-item">
                  <a href="${m.url}">
                    <i class="ti ti-file-text"></i>
                    <div class="home-result-text">
                      <span>${m.title}</span>
                      <small class="home-result-section">${m.section}</small>
                    </div>
                    <i class="ti ti-chevron-right"></i>
                  </a>
                </li>
            `).join('');
        });

        document.getElementById('home-results-clear').addEventListener('click', () => {
            searchInput.value = '';
            homeResults.style.display = 'none';
            grid.style.display = '';
            searchInput.focus();
        });

        function highlightMatch(text, query) {
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, `<strong style="color: #6B3EF5;">$1</strong>`);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrap')) {
                searchResults.classList.remove('active');
            }
        });

        // Popular tags click → inject into search
        document.querySelectorAll('.popular-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                searchInput.value = tag.dataset.query;
                searchInput.dispatchEvent(new Event('input'));
                searchInput.focus();
            });
        });

        renderGrid();

        function openFromHash() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const idx = KB_SECTIONS.findIndex(s => s.id === hash);
                if (idx !== -1) showDetail(idx);
            }
        }
        openFromHash();
        window.addEventListener('hashchange', openFromHash);
    </script>
    <script src="kb-nav.js"></script>
</body>

</html>
