<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages · BrainsMingle</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../../nav/nav.css">
<link rel="stylesheet" href="profile.css">
<script defer src="../../nav/nav.js"></script>
</head>
<body>

<div id="bm-nav" data-active="messages" data-user="Jamie Bennett" data-initials="JB"></div>

<main class="msg-page">
  <div class="msg-wrap">
    <!-- conversation list -->
    <aside class="msg-list">
      <div class="msg-list-head">
        <span class="msg-head-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.4 7.2L4 20l1-4.8A8 8 0 1 1 21 12z"/></svg></span>
        <h1>Messages</h1>
      </div>
      <div class="msg-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input placeholder="Search conversations..." oninput="filterMsgs(this.value)">
      </div>
      <div class="msg-items" id="msgItems"></div>
    </aside>

    <!-- empty state -->
    <section class="msg-empty">
      <span class="msg-empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a8 8 0 0 1-11.4 7.2L4 20l1-4.8A8 8 0 1 1 21 12z"/></svg></span>
      <h2>Your Messages</h2>
      <p>Select a conversation from the list to start chatting, or message someone from your connections.</p>
      <div class="msg-note">You can only message people you've met in an event or call on BrainsMingle.</div>
    </section>
  </div>
</main>

<script>
/* theme init (matches other pages) */
(function(){try{var t=localStorage.getItem('bm-theme');document.documentElement.setAttribute('data-theme',t||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
function toggleTheme(){var d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('bm-theme',d?'light':'dark');}catch(e){}}

/* ---------- conversations (dummy data — edit here) ---------- */
var MSGS=[
  {n:'Emma Clarke',      prev:"Thanks for the session! Let's schedule a follow-up…",        date:'Jul 10', h:0},
  {n:'Michael Larsson',  prev:"You: Sure, I'll send over the agenda by tomorrow…",           date:'Jul 8',  h:2},
  {n:'Marcus Odera',     prev:"It was great connecting at the networking event…",            date:'Jul 3',  h:4},
  {n:'Sophie Marchetti', prev:"You: Looking forward to our consultation next week…",         date:'Jun 28', h:7},
  {n:'Daniel Asante',    prev:"Can we reschedule to Thursday afternoon instead?…",           date:'Jun 22', h:6},
  {n:'Nadia Fares',      prev:"Perfect — talk then. Really enjoyed the roundtable.",          date:'Jun 19', h:1}
];
function initials(n){return n.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}
function renderMsgs(list){
  var host=document.getElementById('msgItems');
  if(!list.length){host.innerHTML='<div class="msg-empty-list">No conversations found.</div>';return;}
  host.innerHTML=list.map(function(x,i){
    return '<div class="msg-item'+(i===0?' active':'')+'" onclick="selectMsg(this)">'+
      '<div class="pf-ai h'+x.h+' msg-ava">'+initials(x.n)+'</div>'+
      '<div class="msg-item-body"><div class="msg-item-name">'+x.n+'</div><div class="msg-item-prev">'+x.prev+'</div></div>'+
      '<div class="msg-item-date">'+x.date+'</div>'+
    '</div>';
  }).join('');
}
renderMsgs(MSGS);
function filterMsgs(q){q=q.toLowerCase();renderMsgs(MSGS.filter(function(x){return x.n.toLowerCase().indexOf(q)>-1||x.prev.toLowerCase().indexOf(q)>-1;}));}
function selectMsg(el){document.querySelectorAll('.msg-item').forEach(function(i){i.classList.toggle('active',i===el);});}
</script>
</body>
</html>
