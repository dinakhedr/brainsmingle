<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — BrainsMingle Suite</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/suite-tokens.css">
    <link rel="stylesheet" href="assets/suite-common.css">
    <style>
        /* ── 404 Layout ── */
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 100px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        /* ── Ambient background glows ── */
        .error-glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
        }

        .error-glow--purple {
            width: 500px;
            height: 500px;
            top: 10%;
            left: -10%;
            background: rgba(107, 62, 245, 0.10);
        }

        .error-glow--cyan {
            width: 400px;
            height: 400px;
            bottom: 5%;
            right: -5%;
            background: rgba(0, 232, 162, 0.08);
        }

        .error-glow--pink {
            width: 300px;
            height: 300px;
            top: 20%;
            right: 10%;
            background: rgba(245, 62, 159, 0.06);
        }

        /* ── SVG Illustration ── */
        .error-illustration {
            position: relative;
            width: 320px;
            max-width: 80vw;
            margin-bottom: var(--space-md);
        }

        .error-illustration svg {
            width: 100%;
            height: auto;
        }

        /* ── Floating shapes ── */
        .float-shape {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
        }

        .float-shape--1 {
            top: 8%;
            left: 5%;
            animation: floatA 6s ease-in-out infinite;
        }

        .float-shape--2 {
            top: 15%;
            right: 8%;
            animation: floatB 7s ease-in-out infinite;
        }

        .float-shape--3 {
            bottom: 20%;
            left: 10%;
            animation: floatC 8s ease-in-out infinite;
        }

        .float-shape--4 {
            bottom: 30%;
            right: 5%;
            animation: floatA 5s ease-in-out infinite 1s;
        }

        .float-shape--5 {
            top: 40%;
            left: 2%;
            animation: floatB 9s ease-in-out infinite 0.5s;
        }

        .float-shape--6 {
            top: 50%;
            right: 2%;
            animation: floatC 6.5s ease-in-out infinite 2s;
        }

        @keyframes floatA {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(8px, -12px) rotate(8deg);
            }
        }

        @keyframes floatB {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(-10px, -8px) rotate(-6deg);
            }
        }

        @keyframes floatC {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(6px, 10px) rotate(5deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .float-shape {
                animation: none !important;
            }
        }

        /* ── Content ── */
        .error-content {
            position: relative;
            z-index: 1;
            max-width: 520px;
        }

        .error-headline {
            font-family: var(--font-display);
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 700;
            color: var(--text);
            margin-bottom: var(--space-md);
            line-height: var(--leading-snug);
        }

        .error-description {
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--text-muted);
            line-height: var(--leading-normal);
            margin-bottom: var(--space-2xl);
        }

        /* ── CTA buttons ── */
        .error-ctas {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            justify-content: center;
            margin-bottom: var(--space-2xl);
        }

        .error-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius-pill);
            font-family: var(--font-display);
            font-size: var(--text-sm);
            font-weight: 600;
            text-decoration: none;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .error-cta--primary {
            background: var(--purple);
            color: var(--on-purple);
        }

        .error-cta--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(107, 62, 245, 0.35);
        }

        .error-cta--ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .error-cta--ghost:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateY(-2px);
        }

        /* ── Quick-link cards ── */
        .error-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
            max-width: 540px;
            width: 100%;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg) var(--space-md);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
            transition: border-color var(--duration-fast), transform var(--duration-fast), background var(--duration-med);
        }

        .error-card:hover {
            transform: translateY(-3px);
            border-color: var(--purple-glow);
        }

        .error-card__icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card__icon--purple {
            background: var(--purple-dim);
            color: var(--purple);
        }

        .error-card__icon--cyan {
            background: var(--cyan-dim);
            color: var(--cyan);
        }

        .error-card__icon--pink {
            background: var(--pink-dim);
            color: var(--pink);
        }

        .error-card__label {
            font-family: var(--font-display);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text);
        }

        /* ── Light theme ── */
        [data-theme="light"] .error-glow--purple {
            background: rgba(90, 46, 224, 0.06);
        }

        [data-theme="light"] .error-glow--cyan {
            background: rgba(0, 158, 111, 0.05);
        }

        [data-theme="light"] .error-glow--pink {
            background: rgba(212, 46, 137, 0.04);
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .error-page {
                padding: 70px 20px 40px;
            }

            .error-illustration {
                width: 300px;
            }

            .error-ctas {
                flex-direction: column;
                align-items: center;
            }

            .error-cta {
                width: 100%;
                max-width: 260px;
                justify-content: center;
            }

            .error-cards {
                grid-template-columns: 1fr;
                max-width: 260px;
            }

            .float-shape {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Nav -->
    <div id="suite-nav"></div>

    <!-- 404 Content -->
    <main class="error-page">

        <!-- Background glows -->
        <div class="error-glow error-glow--purple"></div>
        <div class="error-glow error-glow--cyan"></div>
        <div class="error-glow error-glow--pink"></div>

        <!-- Floating decorative shapes -->
        <svg class="float-shape float-shape--1" width="32" height="32" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="none" stroke="#6B3EF5" stroke-width="1.5" opacity="0.5" />
        </svg>
        <svg class="float-shape float-shape--2" width="28" height="28" viewBox="0 0 28 28">
            <rect x="4" y="4" width="20" height="20" rx="4" fill="none" stroke="#00E8A2" stroke-width="1.5" opacity="0.5" />
        </svg>
        <svg class="float-shape float-shape--3" width="24" height="24" viewBox="0 0 24 24">
            <polygon points="12,2 22,22 2,22" fill="none" stroke="#F53E9F" stroke-width="1.5" opacity="0.4" />
        </svg>
        <svg class="float-shape float-shape--4" width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="#F5A623" opacity="0.12" />
        </svg>
        <svg class="float-shape float-shape--5" width="18" height="18" viewBox="0 0 18 18">
            <rect x="3" y="3" width="12" height="12" rx="2" fill="#6B3EF5" opacity="0.1" />
        </svg>
        <svg class="float-shape float-shape--6" width="22" height="22" viewBox="0 0 22 22">
            <polygon points="11,1 21,8 17,20 5,20 1,8" fill="none" stroke="#00E8A2" stroke-width="1.2" opacity="0.35" />
        </svg>

        <!-- SVG Illustration — disconnected nodes with a missing center -->
        <div class="error-illustration">
            <svg viewBox="30 45 360 230" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Background orbit rings -->
                <circle cx="210" cy="140" r="120" stroke="#6B3EF5" stroke-width="0.5" opacity="0.15" />
                <circle cx="210" cy="140" r="90" stroke="#00E8A2" stroke-width="0.5" opacity="0.12" />
                <circle cx="210" cy="140" r="60" stroke="#F53E9F" stroke-width="0.5" opacity="0.10" />

                <!-- Node 1 — top-left (purple) -->
                <circle cx="120" cy="80" r="22" fill="#6B3EF5" opacity="0.12" />
                <circle cx="120" cy="80" r="12" fill="#6B3EF5" opacity="0.25" />
                <circle cx="120" cy="80" r="5" fill="#6B3EF5" />

                <!-- Node 2 — top-right (cyan) -->
                <circle cx="300" cy="70" r="18" fill="#00E8A2" opacity="0.10" />
                <circle cx="300" cy="70" r="10" fill="#00E8A2" opacity="0.20" />
                <circle cx="300" cy="70" r="4" fill="#00E8A2" />

                <!-- Node 3 — bottom-left (pink) -->
                <circle cx="100" cy="200" r="20" fill="#F53E9F" opacity="0.10" />
                <circle cx="100" cy="200" r="10" fill="#F53E9F" opacity="0.20" />
                <circle cx="100" cy="200" r="4.5" fill="#F53E9F" />

                <!-- Node 4 — bottom-right (amber) -->
                <circle cx="320" cy="210" r="16" fill="#F5A623" opacity="0.10" />
                <circle cx="320" cy="210" r="8" fill="#F5A623" opacity="0.20" />
                <circle cx="320" cy="210" r="3.5" fill="#F5A623" />

                <!-- Dashed connection lines — broken -->
                <line x1="132" y1="88" x2="185" y2="120" stroke="#6B3EF5" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" />
                <line x1="288" y1="78" x2="235" y2="120" stroke="#00E8A2" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" />
                <line x1="112" y1="192" x2="185" y2="160" stroke="#F53E9F" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" />
                <line x1="308" y1="202" x2="235" y2="160" stroke="#F5A623" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" />

                <!-- Faint cross-connections -->
                <line x1="135" y1="85" x2="285" y2="75" stroke="white" stroke-width="0.6" stroke-dasharray="3 8" opacity="0.06" />
                <line x1="115" y1="190" x2="305" y2="205" stroke="white" stroke-width="0.6" stroke-dasharray="3 8" opacity="0.06" />

                <!-- Center — the missing page -->
                <rect x="180" y="110" width="60" height="60" rx="14" stroke="#6B3EF5" stroke-width="1" opacity="0.2" fill="#6B3EF5" fill-opacity="0.06" />
                <text x="210" y="152" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="28" fill="#6B3EF5" opacity="0.5">?</text>

                <!-- Large colorful "404" -->
                <text x="210" y="260" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="52" letter-spacing="-2">
                    <tspan fill="#6B3EF5">4</tspan>
                    <tspan fill="#00E8A2">0</tspan>
                    <tspan fill="#F53E9F">4</tspan>
                </text>

                <!-- Sparkle accents -->
                <path d="M155 60 L158 55 L161 60 L158 65 Z" fill="#6B3EF5" opacity="0.4" />
                <path d="M330 55 L332 51 L334 55 L332 59 Z" fill="#00E8A2" opacity="0.4" />
                <path d="M70 180 L72 176 L74 180 L72 184 Z" fill="#F53E9F" opacity="0.35" />

                <!-- Dot accents -->
                <circle cx="260" cy="100" r="2" fill="#F5A623" opacity="0.5" />
                <circle cx="155" cy="170" r="2" fill="#00E8A2" opacity="0.4" />
                <circle cx="270" cy="180" r="2" fill="#6B3EF5" opacity="0.4" />
                <circle cx="340" cy="140" r="1.5" fill="#F53E9F" opacity="0.3" />
                <circle cx="80" cy="120" r="1.5" fill="#F5A623" opacity="0.3" />
            </svg>
        </div>

        <div class="error-content">
            <h1 class="error-headline">This page doesn't exist yet</h1>
            <p class="error-description">
                The page you're looking for may have been moved, renamed, or is still on its way. Let's get you back on track.
            </p>

            <div class="error-ctas">
                <a href="suite.html" class="error-cta error-cta--primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" />
                    </svg>
                    Back to Suite
                </a>
                <a href="suite/capabilities.html" class="error-cta error-cta--ghost">
                    Explore Capabilities
                </a>
            </div>

            <div class="error-cards">
                <a href="suite/live-sessions.html" class="error-card">
                    <div class="error-card__icon error-card__icon--purple">
                        <span data-icon="liveSession"></span>
                    </div>
                    <span class="error-card__label">Live Sessions</span>
                </a>
                <a href="suite/community.html" class="error-card">
                    <div class="error-card__icon error-card__icon--cyan">
                        <span data-icon="community"></span>
                    </div>
                    <span class="error-card__label">Communities</span>
                </a>
                <a href="suite/courses.html" class="error-card">
                    <div class="error-card__icon error-card__icon--pink">
                        <span data-icon="courses"></span>
                    </div>
                    <span class="error-card__label">Courses & LMS</span>
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div id="suite-footer"></div>

    <script src="assets/suite-icons.js"></script>
    <script src="assets/suite-nav.js"></script>
    <script>
        document.querySelectorAll('[data-icon]').forEach(function(el) {
            var key = el.getAttribute('data-icon');
            if (window.SUITE_ICONS && window.SUITE_ICONS[key]) {
                el.innerHTML = window.SUITE_ICONS[key];
            }
        });
    </script>

</body>

</html>
